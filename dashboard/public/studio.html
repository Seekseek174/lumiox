<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lumiox – Visual Command Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141419;--panel:#1b1c22;--panel2:#23242c;--line:#2a2b33;--text:#e8e9ee;--dim:#8b93a7;--red:#e8484f;--blue:#4aa3ff;--gruen:#34d399;--gelb:#fbbf24;--rot:#f43f5e;--cyan:#22d3ee;--lila:#9b59b6;--orange:#f7931a;--rosa:#e879f9;--indigo:#818cf8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
button{font-family:Inter;cursor:pointer}
input,select,textarea{font-family:Inter}
#topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 14px;font:600 12px Inter;cursor:pointer;transition:.15s}
.tb:hover{border-color:#55565f}
.tb.rot{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
.tb.rot:hover{filter:brightness(1.15)}
.tbsep{width:1px;height:26px;background:var(--line)}
#topbar input,#topbar select{background:#0f1015;border:1px solid #33343d;border-radius:8px;color:var(--text);padding:8px 12px;font:600 13px Inter}
#cName{width:150px}#cDesc{width:200px}#cCd{width:65px}
#cRoles{max-width:170px;height:36px}
#saveAnz{margin-left:auto;font-size:11px;color:var(--dim)}
#main{display:flex;height:calc(100vh - 52px)}
#pal{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#pal .kopf{padding:14px 14px 8px}
#pal h3{font-size:16px}
#pal .sub{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.5}
#pal .sub .b1{color:var(--cyan);font-weight:600}#pal .sub .b2{color:var(--gruen);font-weight:600}#pal .sub .b3{color:var(--gelb);font-weight:600}
#palTabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 8px;gap:4px}
#palTabs button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:6px 10px;border-radius:7px;cursor:pointer;font:600 11px Inter}
#palTabs button.akt{background:linear-gradient(120deg,var(--cyan),var(--indigo));color:#fff;border-color:transparent}
#suche{margin:10px;padding:9px 12px;background:#0f1015;border:1px solid #33343d;border-radius:8px;color:var(--text);font:13px Inter;width:calc(100% - 20px)}
#palListe{flex:1;overflow-y:auto;padding:4px 10px 20px}
.katT{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:10px 4px 5px}
.blk{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:grab;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,transform .15s}
.blk:hover{border-color:var(--c);transform:translateY(-1px)}
.blk:active{cursor:grabbing}
.blk .ico{width:32px;height:32px;border-radius:8px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.blk b{font-size:12.5px;display:block}
.blk small{color:var(--dim);font-size:10.5px;line-height:1.35;display:block;margin-top:2px}
#wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
#linien{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.node{position:absolute;width:240px;background:var(--panel2);border:2px solid #3a3b45;border-radius:12px;box-shadow:0 10px 32px rgba(0,0,0,.55);z-index:5;user-select:none}
.node.sel{border-color:var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 40%,transparent)}
.node .kopf{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:grab;border-bottom:1px solid rgba(255,255,255,.06)}
.node .kopf:active{cursor:grabbing}
.node .kopf .ico{width:28px;height:28px;border-radius:8px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.node .kopf b{font-size:12.5px;flex:1}
.node .del{color:var(--dim);cursor:pointer;font-size:13px;background:none;border:none;opacity:.6}
.node .del:hover{color:var(--red);opacity:1}
.node .txt{padding:9px 12px 11px;font-size:11px;color:var(--dim);line-height:1.45;word-break:break-word}
.node .txt b{color:var(--text)}
.port{position:absolute;width:15px;height:15px;border-radius:50%;border:2.5px solid var(--bg);cursor:crosshair;z-index:10;transition:transform .12s}
.port:hover{transform:scale(1.4)}
.port.in{top:-8px;left:50%;transform:translateX(-50%);background:var(--blue)}
.port.in:hover{transform:translateX(-50%) scale(1.35)}
.port.out{bottom:-8px;left:50%;transform:translateX(-50%);background:var(--blue)}
.port.out:hover{transform:translateX(-50%) scale(1.35)}
.port.dann{bottom:-8px;left:28%;background:var(--gruen)}
.port.dann:hover{transform:scale(1.35)}
.port.sonst{bottom:-8px;right:28%;background:var(--rot)}
.port.sonst:hover{transform:scale(1.35)}
.plab{position:absolute;font-size:9px;font-weight:800;color:var(--gruen);bottom:-24px;left:20%}
.plab2{position:absolute;font-size:9px;font-weight:800;color:var(--rot);bottom:-24px;right:20%}
#zoomCtl{position:absolute;bottom:16px;right:16px;z-index:30;display:flex;flex-direction:column;gap:6px}
#zoomCtl button{width:36px;height:36px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:16px;cursor:pointer}
#zoomAnz{position:absolute;bottom:16px;right:60px;z-index:30;font:700 11px ui-monospace;color:var(--dim);background:var(--panel2);padding:5px 9px;border-radius:6px}
#minimap{position:absolute;bottom:16px;left:16px;width:150px;height:95px;background:rgba(10,12,20,.9);border:1px solid var(--line);border-radius:10px;z-index:30;overflow:hidden}
#minimap .mn{position:absolute;background:var(--cyan);border-radius:2px;opacity:.75}
#ctx{position:fixed;z-index:300;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;min-width:180px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#ctx button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 14px;border-radius:7px;font:500 13px Inter;cursor:pointer}
#ctx button:hover{background:rgba(255,255,255,.08)}
#ctx hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal .karte{width:440px;max-width:92vw;background:var(--panel2);border:1px solid #33343d;border-radius:14px;padding:20px;max-height:82vh;overflow-y:auto}
#modal h3{font-size:15px;margin-bottom:4px}
#modal .unter{font-size:11.5px;color:var(--dim);margin-bottom:12px;line-height:1.5}
#modal label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:600}
#modal input,#modal select,#modal textarea{width:100%;background:#0f1015;border:1px solid #33343d;border-radius:8px;color:var(--text);padding:9px 12px;font:13px Inter}
#modal textarea{resize:vertical;min-height:64px}
#modal .chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:12px 0}
#modal .chk input{width:auto}
#modal .btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
#modal .btns button{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font:700 13px Inter}
#modal .ok{background:linear-gradient(120deg,var(--cyan),var(--indigo));color:#fff}
#modal .zu{background:#33343d;color:var(--text)}
#toasts{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:rgba(24,28,46,.96);border-left:4px solid var(--cyan);border-radius:10px;padding:12px 18px;font:500 13px Inter;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tI .25s ease}
.toast.ok{border-left-color:var(--gruen)}.toast.err{border-left-color:var(--red)}
@keyframes tI{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
#kurzbefehle{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:11px;color:var(--dim);display:flex;gap:14px}
#kurzbefehle b{color:var(--text)}
</style>
</head>
<body>
<div id="topbar">
  <a class="tb" href="/index.html" title="Zurück">← Dashboard</a>
  <button class="tb" id="buchB">📖 Nutz-Buch</button>
  <button class="tb" id="undoB">↶ Undo</button>
  <button class="tb" id="redoB">↷ Redo</button>
  <div class="tbsep"></div>
  <input id="cName" placeholder="command-name">
  <input id="cDesc" placeholder="Beschreibung">
  <input id="cCd" type="number" placeholder="CD" value="0">
  <select id="cRoles" multiple title="Rollen (leer = alle)"></select>
  <span id="saveAnz">Noch nicht gespeichert</span>
  <button class="tb rot" id="saveB">💾 Save Command</button>
</div>
<div id="main">
  <div id="pal">
    <div class="kopf">
      <h3>🧩 Blocks</h3>
      <div class="sub">Drag die <span class="b1">Actions</span> und <span class="b3">Conditions</span> auf die Fläche und verbinde die Punkte für deinen Ablauf.</div>
    </div>
    <div id="palTabs"></div>
    <input id="suche" placeholder="🔍 Search blocks …">
    <div id="palListe"></div>
  </div>
  <div id="wrap">
    <svg id="linien"></svg>
    <div id="minimap"></div>
    <div id="zoomCtl">
      <button id="zIn">+</button><button id="zOut">−</button><button id="zFit">⛶</button>
    </div>
    <div id="zoomAnz">100 %</div>
  </div>
</div>
<div id="ctx"></div>
<div id="modal">
  <div class="karte">
    <h3 id="mTitel"></h3>
    <div class="unter" id="mUnter"></div>
    <div id="mBody"></div>
    <div class="btns"><button class="zu" id="mZu">Abbrechen</button><button class="ok" id="mOk">Übernehmen</button></div>
  </div>
</div>
<div id="toasts"></div>
<div id="kurzbefehle"><b>Strg+Z</b> Undo · <b>Strg+Y</b> Redo · <b>Entf</b> Löschen · <b>Strg+S</b> Speichern · <b>Strg+D</b> Duplizieren · <b>Rechtsklick</b> Menü</div>

];
const KAT_NAMEN = { start:'▶️ Start', message:'💬 Message', conditions:'❓ Conditions', roles:'🏷️ Roles',
  channels:'#️⃣ Channels', server:'⚙️ Server', wirtschaft:'💰 Wirtschaft', variables:'📝 Variables',
  api:'🌐 API', loops:'🔁 Loops', voice:'🔊 Voice', other:'✨ Other' };

// ═══ STATE ═══
let nodes = [], edges = [], nid = 1, selId = null, connect = null;
let panX = 0, panY = 0, panAktiv = false, panStart = null, panning = false;
let zoom = 1, palTab = 'message', palFilter = '', editId = null;
let undoStack = [], redoStack = [];
let kopiert = null;
const WRAP = document.getElementById('wrap');
const SVG = document.getElementById('linien');

// ═══ HELFER ═══
const gid = () => new URLSearchParams(location.search).get('g') || '';
const esc = (t) => String(t ?? '').replace(/[<>&"']/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, typ) {
  const t = document.createElement('div');
  t.className = 'toast ' + (typ || ''); t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function katVon(typ) { return KAT.find((k) => k.typ === typ) || { typ:'start', c:'#34d399', ico:'▶️', name:'START' }; }
function saveAnzeige(txt) { const e = document.getElementById('saveAnz'); e.textContent = txt; e.className = txt.includes('✓') ? '' : 'warn'; }
function snapshot() { undoStack.push(JSON.stringify({ nodes, edges })); if (undoStack.length > 50) undoStack.shift(); redoStack = []; markDirty(); }
function markDirty() { document.getElementById('saveAnz').textContent = '⚠ Ungespeicherte Änderungen'; }
async function API(m, u, b) {
  const o = { method: m, headers: { 'Content-Type': 'application/json' } };
  if (b !== undefined) o.body = JSON.stringify(b);
  const r = await fetch('/api' + u, o);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

// ═══ UNDO / REDO ═══
function doUndo() { if (!undoStack.length) return toast('Nichts zum Undo', 'err');
  redoStack.push(JSON.stringify({ nodes, edges }));
  const st = JSON.parse(undoStack.pop()); nodes = st.nodes; edges = st.edges; render(); }
function doRedo() { if (!redoStack.length) return toast('Nichts zum Redo', 'err');
  undoStack.push(JSON.stringify({ nodes, edges }));
  const st = JSON.parse(redoStack.pop()); nodes = st.nodes; edges = st.edges; render(); }
document.getElementById('undoB').addEventListener('click', doUndo);
document.getElementById('redoB').addEventListener('click', doRedo);

// ═══ PALETTE ═══
let aktPalKat = 'message';
function palette() {
  const tabs = document.getElementById('palTabs');
  const reihen = ['start','message','conditions','roles','channels','server','wirtschaft','variables','api','loops','voice','other'];
  tabs.innerHTML = reihen.map((k) => '<button data-k="' + k + '" class="' + (aktPalKat === k ? 'akt' : '') + '">' +
    (KAT_NAMEN[k] || k) + '</button>').join('');
  tabs.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { aktPalKat = b.dataset.k; palette(); }));
  const box = document.getElementById('palListe');
  box.innerHTML = '';
  const katTitel = document.createElement('div');
  katTitel.className = 'katT'; katTitel.textContent = KAT_NAMEN[aktPalKat] || aktPalKat;
  box.appendChild(katTitel);
  KAT.filter((k) => k.kat === aktPalKat)
     .filter((k) => !palFilter || k.name.toLowerCase().includes(palFilter) || k.desc.toLowerCase().includes(palFilter))
     .forEach((k) => {
    const d = document.createElement('div');
    d.className = 'blk'; d.style.setProperty('--c', k.c);
    d.innerHTML = '<div class="ico">' + k.ico + '</div><div><b>' + esc(k.name) + '</b><small>' + esc(k.desc) + '</small></div>';
    d.addEventListener('click', () => { snapshot(); addNode(k); });
    box.appendChild(d);
  });
}
document.getElementById('suche').addEventListener('input', (e) => { palFilter = e.target.value.toLowerCase(); palette(); });

// ═══ NODES ═══
function addNode(kat) {
  const n = { id: 'n' + (nid++), typ: kat.typ, x: 120 - panX + (nodes.length % 5) * 30,
    y: 100 - panY + Math.floor(nodes.length / 5) * 40, felder: {} };
  kat.felder.forEach((f) => { n.felder[f.k] = f.t === 'nested' ? [] : (f.d != null ? f.d : (f.t === 'bool' ? false : '')); });
  nodes.push(n); render();
}
function delNode(id) { snapshot(); nodes = nodes.filter((n) => n.id !== id);
  edges = edges.filter((e) => e.from !== id && e.to !== id); render(); }

// ═══ PORT-POSITION ═══
function portPos(n, port) {
  const nodeEl = document.querySelector('.node[data-id="' + n.id + '"]');
  const h = nodeEl ? nodeEl.offsetHeight : 60;
  let x = n.x + 120 * zoom - panX;
  let y = n.y + h * zoom - panY;
  if (port === 'dann') x = n.x + 70 * zoom - panX;
  if (port === 'sonst') x = n.x + 160 * zoom - panX;
  return { x, y };
}
function summarize(n) {
  const f = n.felder || {};
  if (f.text) return '"' + String(f.text).slice(0, 50) + '"';
  if (f.menge) return 'Menge: ' + f.menge;
  if (f.chance) return 'Chance: ' + f.chance + '%';
  if (f.equation) return '= ' + f.equation;
  if (f.rolle) return 'Rolle';
  return 'Doppelklick für Details';
}
function minimap() {
  const mm = document.getElementById('minimap');
  mm.querySelectorAll('.mn').forEach((x) => x.remove());
  if (!nodes.length) return;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const n of nodes) { minX = Math.min(minX, n.x); minY = Math.min(minY, n.y); maxX = Math.max(maxX, n.x + 240); maxY = Math.max(maxY, n.y + 60); }
  const spX = Math.max(1, maxX - minX), spY = Math.max(1, maxY - minY);
  for (const n of nodes) {
    const m = document.createElement('div'); m.className = 'mn';
    m.style.left = ((n.x - minX) / spX * 138 + 4) + 'px';
    m.style.top = ((n.y - minY) / spY * 85 + 4) + 'px';
    mm.appendChild(m);
  }
}

// ═══ RENDER ═══
function render() {
  WRAP.querySelectorAll('.node').forEach((n) => n.remove());
  SVG.innerHTML = '';
  // Alle Koordinaten werden mit panX/panY und zoom transformiert
  const tx = (x) => (x * zoom) - panX;
  const ty = (y) => (y * zoom) - panY;
  for (const e of edges) {
    const von = nodes.find((n) => n.id === e.from), zu = nodes.find((n) => n.id === e.to);
    if (!von || !zu) continue;
    const p1 = { x: tx(von.x) + 120 * zoom, y: ty(von.y) + 55 * zoom };
    const p2 = { x: tx(zu.x), y: ty(zu.y) + 14 * zoom };
    const mx = (p1.x + p2.x) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M' + p1.x + ',' + p1.y + ' C' + mx + ',' + p1.y + ' ' + mx + ',' + p2.y + ' ' + p2.x + ',' + p2.y);
    path.setAttribute('stroke', e.fromPort === 'dann' ? '#34d399' : e.fromPort === 'sonst' ? '#f43f5e' : '#4aa3ff');
    path.setAttribute('stroke-width', '2.5'); path.setAttribute('fill', 'none');
    SVG.appendChild(path);
  }
  for (const n of nodes) {
    const k = katVon(n.typ);
    const d = document.createElement('div');
    d.className = 'node' + (selId === n.id ? ' sel' : '');
    d.style.left = tx(n.x) + 'px'; d.style.top = ty(n.y) + 'px';
    d.style.setProperty('--c', k.c); d.dataset.id = n.id;
    d.style.width = (240 * zoom) + 'px';
    d.style.transform = 'scale(' + zoom + ')'; d.style.transformOrigin = 'top left';
    const condPorts = ['if_role','if_money','comparison','random','permission','channel_cond','user_cond','var_vergleich'].includes(n.typ);
    const ports = condPorts
      ? '<span class="port dann" data-port="dann"></span><span class="plab">DANN</span>' +
        '<span class="port sonst" data-port="sonst"></span><span class="plab2">SONST</span>'
      : '<span class="port out" data-port="out"></span>';
    d.innerHTML = '<div class="kopf"><div class="ico">' + k.ico + '</div><b>' + esc(k.name) + '</b>' +
      (n.typ !== 'start' ? '<button class="del">✕</button>' : '') + '</div>' +
      '<div class="txt"><b>' + esc(summarize(n)) + '</b></div>' + ports;
    d.querySelector('.kopf').addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; e.preventDefault();
      const sx = e.clientX - tx(n.x), sy = e.clientY - ty(n.y);
      const mv = (ev) => { n.x = (ev.clientX - sx + panX) / zoom; n.y = (ev.clientY - sy + panY) / zoom; render(); };
      const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
      addEventListener('mousemove', mv); addEventListener('mouseup', up);
    });
    d.querySelector('.del')?.addEventListener('click', (e) => { e.stopPropagation(); delNode(n.id); });
    d.addEventListener('dblclick', () => editNode(n));
    d.addEventListener('click', (e) => { e.stopPropagation(); selId = n.id; render(); });
    d.addEventListener('contextmenu', (e) => { e.preventDefault(); selId = n.id; kontext(e.clientX, e.clientY, n.id); });
    d.querySelectorAll('.port').forEach((port) => {
      port.addEventListener('mousedown', (e) => {
        e.preventDefault(); e.stopPropagation();
        connect = { node: n.id, port: port.dataset.port };
      });
    });
    WRAP.appendChild(d);
  }
  minimap();
}

// ═══ CONNECT & PAN & ZOOM ═══
addEventListener('mousemove', (e) => {
  if (connect) {
    const r = WRAP.getBoundingClientRect();
    const tmp = document.getElementById('tmpL');
    if (tmp) { tmp.setAttribute('x2', e.clientX - r.left); tmp.setAttribute('y2', e.clientY - r.top); }
  if (panning) {
    panX += e.clientX - panStart.x; panY += e.clientY - panStart.y;
    panStart = { x: e.clientX, y: e.clientY };
    WRAP.querySelectorAll('.node').forEach((n) => {
      const el = n;
      el.style.left = (parseFloat(el.style.left) + (e.clientX - panStart.x === 0 ? 0 : 0)) + 'px';
    });
    render(); // WICHTIG: render() verschiebt alles korrekt, da panX/panY einfließen
  }
});
addEventListener('mouseup', (e) => {
  if (connect) {
    const ziel = e.target.closest('.node');
    if (ziel && ziel.dataset.id !== connect.node) {
      snapshot();
      edges = edges.filter((ed) => !(ed.from === connect.node && ed.fromPort === connect.port));
      edges.push({ from: connect.node, fromPort: connect.port, to: ziel.dataset.id });
      toast('Verbunden ✔', 'ok');
    }
    connect = null; render();
  }
  panning = false;
});
WRAP.addEventListener('mousedown', (e) => {
  if (e.target.id === 'wrap' || e.target.id === 'linien') {
    if (e.button === 0) { panAktiv = true; panStart = { x: e.clientX, y: e.clientY }; }
  }
});
document.addEventListener('click', () => { document.getElementById('ctx').style.display = 'none'; });
function setZoom(f) {
  zoom = Math.max(0.3, Math.min(2.5, zoom * f));
  document.getElementById('zoomAnz').textContent = Math.round(zoom * 100) + ' %';
  render();
}
document.getElementById('zIn').addEventListener('click', () => setZoom(1.2));
document.getElementById('zOut').addEventListener('click', () => setZoom(1 / 1.2));
document.getElementById('zFit').addEventListener('click', () => { zoom = 1;
  document.getElementById('zoomAnz').textContent = '100 %'; render(); });
WRAP.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(e.deltaY > 0 ? 1/1.12 : 1.12); }, { passive: false });

// ═══ KONTEXT-MENÜ ═══
function kontext(x, y, id) {
  const c = document.getElementById('ctx');
  c.innerHTML = '';
  [['✏️ Bearbeiten', () => editNode(nodes.find((n) => n.id === id))],
   ['📄 Duplizieren', () => { snapshot();
     const n = nodes.find((x2) => x2.id === id);
     const kopie = JSON.parse(JSON.stringify(n));
     kopie.id = 'n' + (nid++); kopie.x += 40; kopie.y += 40;
     nodes.push(kopie); render(); }],
   '-', ['🗑️ Löschen', () => delNode(id)],
  ].forEach(([label, fn]) => {
    if (label === '-') { c.appendChild(document.createElement('hr')); return; }
    const b = document.createElement('button'); b.textContent = label;
    b.addEventListener('click', () => { c.style.display = 'none'; fn(); });
    c.appendChild(b);
  });
  c.style.display = 'block';
  c.style.left = Math.min(x, innerWidth - 190) + 'px';
  c.style.top = Math.min(y, innerHeight - 160) + 'px';
}

// ═══ FELD-EDIT ═══
function editNode(n) {
  const k = katVon(n.typ);
  document.getElementById('mTitel').textContent = k.ico + ' ' + k.name;
  document.getElementById('mUnter').textContent = k.desc + ' · Variablen: {user} {username} {server} {member}';
  const body = document.getElementById('mBody');
  body.innerHTML = '';
  k.felder.forEach((f) => {
    const cur = (n.felder || {})[f.k];
    if (f.t === 'nested') return;
    const l = document.createElement('label'); l.textContent = f.l; body.appendChild(l);
    if (f.t === 'bool') {
      const w = document.createElement('div'); w.className = 'chk';
      const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!cur;
      c.addEventListener('change', () => { n.felder[f.k] = c.checked; });
      w.appendChild(c); const sp = document.createElement('span'); sp.textContent = 'Aktiv'; w.appendChild(sp);
      body.appendChild(w);
    } else if (f.t === 'select') {
      const sel = document.createElement('select');
      (f.opts || []).forEach((o) => { const op = document.createElement('option');
        op.value = o; op.textContent = o; if (cur === o) op.selected = true; sel.appendChild(op); });
      sel.addEventListener('change', () => { n.felder[f.k] = sel.value; });
      body.appendChild(sel);
    } else if (f.t === 'rolle') {
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">– laden …</option>';
      fetch('/api/roles').then((r) => r.json()).then((r2) => {
        sel.innerHTML = '<option value="">– wählen –</option>' + r2.liste.map((x) =>
          '<option value="' + esc(x.id) + '"' + (cur === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('');
      }).catch(() => {});
      sel.addEventListener('change', () => { n.felder[f.k] = sel.value; });
      body.appendChild(sel);
    } else {
      const i = document.createElement(f.t === 'textarea' ? 'textarea' : 'input');
      if (i.tagName === 'INPUT') i.type = f.t === 'number' ? 'number' : 'text';
      i.value = cur ?? f.d ?? '';
      i.addEventListener('input', () => { n.felder[f.k] = i.value; });
      body.appendChild(i);
    }
  });
  const m = document.getElementById('modal'); m.style.display = 'flex';
  document.getElementById('mOk').onclick = () => { m.style.display = 'none'; render(); markDirty(); };
  document.getElementById('mZu').onclick = () => { m.style.display = 'none'; };
}

// ═══ SAVE / LOAD ═══
async function speichern() {
  const name = document.getElementById('cName').value.toLowerCase().trim();
  if (!name) return toast('Bitte command-name eingeben!', 'err');
  if (!nodes.length) return toast('Mindestens ein Block auf der Leinwand!', 'err');
  try {
    const payload = { name, description: document.getElementById('cDesc').value,
      cooldown: Number(document.getElementById('cCd').value) || 0,
      roles: [...document.getElementById('cRoles').selectedOptions].map((o) => o.value),
      guildId: gid(), nodes, edges };
    if (editId) payload.id = editId;
    await API('POST', '/studio/befehle', payload);
    editId = null;
    document.getElementById('saveAnz').textContent = '✓ Gespeichert: ' + new Date().toLocaleTimeString('de-DE');
    toast('💾 Gespeichert & live geladen! /' + name, 'ok');
  } catch (e) { toast('Fehler: ' + e.message, 'err'); }
}
document.getElementById('saveB').addEventListener('click', speichern);
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); speichern(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); doUndo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); doRedo(); }
  if (e.key === 'Delete' && selId && document.activeElement.tagName !== 'INPUT') { delNode(selId); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'd' && selId) {
    e.preventDefault();
    const n = nodes.find((x) => x.id === selId);
    if (n) { const kopie = JSON.parse(JSON.stringify(n));
      kopie.id = 'n' + (nid++); kopie.x += 50; kopie.y += 50;
      nodes.push(kopie); render(); toast('Dupliziert ✔', 'ok'); }
  }
});

// ═══ IMPORT / EXPORT ═══
document.getElementById('topbar').insertAdjacentHTML('beforeend',
  '<button class="tb" id="expB">📤 Export</button><button class="tb" id="impB">📥 Import</button>');
document.getElementById('expB').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ name: document.getElementById('cName').value, nodes, edges }, null, 2)], { type: 'application/json' }));
  a.download = 'lumiox-command.json'; a.click();
});
document.getElementById('impB').addEventListener('click', () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
  i.addEventListener('change', () => { const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try {
      const d = JSON.parse(r.result); snapshot();
      nodes = d.nodes || []; edges = d.edges || [];
      if (d.name) document.getElementById('cName').value = d.name;
      render(); toast('Importiert ✔', 'ok');
    } catch (_) { toast('Ungültige Datei', 'err'); } };
    r.readAsText(f);
  });
  i.click();
});

// ═══ ROLLEN ═══
fetch('/api/roles').then((r) => r.json()).then((r) => {
  document.getElementById('cRoles').innerHTML = r.liste.map((x) =>
    '<option value="' + esc(x.id) + '">' + esc(x.name) + '</option>').join('');
}).catch(() => {});

// ═══ START ═══
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  if (id) {
    try {
      const r = await fetch('/api/studio/befehl/' + id).then((x) => x.json());
      const c = r.befehl;
      editId = c.id;
      document.getElementById('cName').value = c.name;
      document.getElementById('cDesc').value = c.description || '';
      document.getElementById('cCd').value = c.cooldown || 0;
      nodes = (c.nodes && c.nodes.length) ? JSON.parse(JSON.stringify(c.nodes)) : [];
      edges = c.edges || [];
      nid = nodes.length + 1;
      render(); toast('Befehl geladen ✔', 'ok');
      return;
    } catch (_) {}
  }
  nodes.push({ id: 'n0', typ: 'start', x: 80, y: 150, felder: {} });
  nid = 1;
  render();
})();
palette();
</script>
</body>
</html>
