<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <linearGradient id="ring" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="110" cy="110" r="70" fill="none" stroke="url(#ring)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="355 85" transform="rotate(35 110 110)" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <rect x="160" y="58" width="26" height="10" rx="5" fill="#22d3ee"/>
    <rect x="167" y="80" width="23" height="10" rx="5" fill="#60a5fa"/>
    <rect x="170" y="100" width="22" height="10" rx="5" fill="#818cf8"/>
    <rect x="167" y="120" width="23" height="10" rx="5" fill="#c084fc"/>
    <rect x="160" y="142" width="26" height="10" rx="5" fill="#e879f9"/>
  </g>
</svg>
